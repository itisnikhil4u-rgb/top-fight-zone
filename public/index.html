<style>
/* visual polish */
@keyframes tfzIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
#ui-layer > div[id^="screen-"]:not(.hidden) { animation: tfzIn .3s ease-out; }
.cyber-btn { transition: transform .12s, box-shadow .2s, filter .2s; }
.cyber-btn:hover { filter: brightness(1.18); box-shadow: 0 0 18px rgba(34,211,238,.55); transform: translateY(-1px); }
.cyber-btn:active { transform: scale(.97); }
#fx-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity .25s; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
#fx-wobble { position: fixed; inset: 0; pointer-events: none; z-index: 41; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,20,40,0) 48%, rgba(255,25,45,.5) 100%); box-shadow: inset 0 0 60px 6px rgba(255,20,40,.45); }
#fx-wobble.on { animation: wobPulse .9s ease-in-out infinite; }
@keyframes wobPulse { 0%, 100% { opacity: calc(var(--wi, 1) * .5); } 50% { opacity: var(--wi, 1); } }
#fx-vignette.on { opacity: 1; }
#fx-vignette.hurt { background: radial-gradient(ellipse at center, rgba(255,0,40,0) 38%, rgba(255,0,40,.6) 100%); opacity: 1; transition: none; }
body.boss-fight #fx-vignette.on:not(.hurt) { animation: bossPulse 1.6s ease-in-out infinite; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(130,20,170,.55) 100%); }
@keyframes bossPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.tfz-confetti { position: fixed; top: -20px; width: 9px; height: 14px; z-index: 95; pointer-events: none; animation: tfzFall linear forwards; }
@keyframes tfzFall { to { transform: translate3d(var(--dx), 112vh, 0) rotate(720deg); } }
/* use the real visible height in phone/desktop browsers (100vh is taller than the visible area there) */
html, body { height: 100%; }
body { height: 100dvh !important; }
.h-screen { height: 100dvh !important; }
/* menus never run off the screen: scroll if needed, and shrink on short screens */
#screen-main-menu { max-height: calc(100dvh - 2rem) !important; overflow-y: scroll !important; -webkit-overflow-scrolling: touch; touch-action: pan-y !important; flex-shrink: 1 !important; min-height: 0 !important; }
#screen-main-menu * { touch-action: pan-y; }
#map-selector-container button { font-size: 10px !important; padding: 6px 3px !important; line-height: 1.1 !important; flex-direction: column !important; gap: 3px; }
#map-selector-container button > span { margin-left: 0 !important; text-align: center; }
@media (max-height: 760px) {
  #screen-main-menu .font-orbitron.text-3xl, #screen-main-menu h1 { font-size: 1.35rem !important; }
  #screen-main-menu button.cyber-btn { padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; font-size: 0.85rem !important; }
  #screen-main-menu > * + * { margin-top: 0.4rem !important; }
}
#ui-layer > div[id^="screen-"]:not(#screen-shop) { max-height: calc(100dvh - 1.5rem); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
@media (max-height: 860px) {

}

        (function addMarbleLevels() {
            let sd = 777; const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
            MARBLE_QUIRKS.forEach((q, i) => {
                const rows = 6 + Math.floor(i * 0.45), gap = Math.max(4.6, 8.6 - i * 0.2), pillars = [], movers = [];
                for (let rr = 0; rr < rows; rr++) {
                    const z = -11 - rr * gap; if (z < -60) break; const pat = rnd();
                    if (i >= 8 && pat < 0.22) [-3.2, 0, 3.2].forEach(x => pillars.push([x, z]));
                    else if (pat < 0.6) pillars.push([-3.4 + rnd() * 1.2, z], [1.8 + rnd() * 1.4, z]);
                    else pillars.push([-3.5 + rnd() * 7, z]);

                const mc = Math.min(5, 1 + Math.floor(i / 4) + (q.movSpd ? 2 : 0));

                MARBLE_LEVELS.push({ pillars: pillars, movers: movers, q: q });

        const EXCLUSIVES = [['Aurora Wraith', 0x34d399, 0x064e3b, 0], ['Inferno Seraph', 0xfb7185, 0x7f1d1d, 1], ['Glacier Monarch', 0x7dd3fc, 0x0c4a6e, 2], ['Solar Pharaoh', 0xfde047, 0x713f12, 3], ['Void Reaper', 0xa78bfa, 0x1e1b4b, 9], ['Thunder Titan', 0x60a5fa, 0x172554, 8], ['Crimson Phantom', 0xf43f5e, 0x4c0519, 11], ['Jade Dragon', 0x4ade80, 0x14532d, 5], ['Neon Samurai', 0xf0abfc, 0x581c87, 6], ['Cosmic Oracle', 0xc084fc, 0x3b0764, 10], ['Golden Phoenix', 0xfbbf24, 0x78350f, 4], ['Shadow Viper', 0x94a3b8, 0x020617, 7]];
        EXCLUSIVES.forEach((e, i) => {                    // battle-pass only skins (ids 12-23), same move as their base skin but stronger

        class RealTop {
            constructor(isPlayer, skin, x, z, powerMult = 1.0) {
                this.isPlayer = isPlayer;
                this.skin = skin;
                this.maxStamina = (skin.stamina * 2.2) * powerMult;
                this.stamina = this.maxStamina;
                this.attack = skin.attack;
                this.weight = skin.weight;
                this.position = new THREE.Vector3(x, 0.02, z);
                this.velocity = new THREE.Vector3();
                this.isEliminated = false;
                this.abilityCooldown = 0;

                const group = new THREE.Group();

                // Realistic turned top: steel tip, lathe body, rim ring, collar, stem, knob
                const model = new THREE.Group();
                const steel = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.18, metalness: 1.0 });

                rim.rotation.x = Math.PI / 2; rim.position.y = 0.56; model.add(rim);
                const stripe = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.04, 8, 64), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3, metalness: 0.4 }));
                stripe.rotation.x = Math.PI / 2; stripe.position.y = 0.32; model.add(stripe);
                const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.4, 0.16, 32), steel);
                collar.position.y = 1.05; model.add(collar);
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.7, 20), gold);
                stem.position.y = 1.4; model.add(stem);
                const knob = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), gold);
                knob.position.y = 1.8; model.add(knob);
                model.traverse(o => { if (o.isMesh) o.castShadow = true; });
                model.position.y = 0.6;
                group.add(model);

                group.position.copy(this.position);
                scene.add(group);
                this.mesh = group;
            }

            eliminate() {
                if (this.isEliminated) return;
                this.isEliminated = true;
                if (this.mesh) {
                    dissolvingMeshes.push({ mesh: this.mesh, progress: 0 });
                }
            }

            update(dt) {
                if (this.isEliminated) return;

                this.stamina -= dt * 3.5 * (window.__drain === undefined ? 1 : window.__drain);
                if (this.stamina <= 0) {
                    this.stamina = 0;
                    this.eliminate();
                    if (this.isPlayer && this.isEliminated) window.playerOut(30);
                    return;
                }

                if (this.isPlayer) {
                    let moveX = 0, moveZ = 0;
                    if (keys.w) moveZ -= 1;
                    if (keys.s) moveZ += 1;
                    if (keys.a) moveX -= 1;
                    if (keys.d) moveX += 1;

                    if (touchMove.x !== 0 || touchMove.z !== 0) {
                        moveX = touchMove.x;
                        moveZ = touchMove.z;
                    }

                    const speed = 22 * (this.skin.speed || 1) * (window.__spd || 1);
                    this.velocity.x += moveX * speed * dt;
                    this.velocity.z += moveZ * speed * dt;
                } else if (this.steer) {
                    this.steer(dt);
                } else if (playerTop && !playerTop.isEliminated) {
                    const dir = new THREE.Vector3().subVectors(playerTop.position, this.position).normalize();
                    this.velocity.addScaledVector(dir, 8 * dt);
                }

                this.velocity.multiplyScalar(window.__damp || 0.96);
                this.position.addScaledVector(this.velocity, dt);

                const ringRadius = window.__ringR || 13.5;
                if (this.position.length() > ringRadius) {
                    this.eliminate();
                    if (this.isPlayer && this.isEliminated) window.playerOut(40);
                    else if (window.checkWin) window.checkWin();
                    return;
                }

                if (this.mesh) {
                    this.mesh.position.copy(this.position);
                    this.mesh.rotation.y += (this.stamina / this.maxStamina) * 1.6;

                    const staminaRatio = this.stamina / this.maxStamina;
                    if (staminaRatio < 0.40) {
                        const wobbleFactor = (0.40 - staminaRatio) * 0.9;
                        const wobbleSpeed = performance.now() * 0.025;
                        this.mesh.rotation.x = Math.sin(wobbleSpeed) * wobbleFactor;
                        this.mesh.rotation.z = Math.cos(wobbleSpeed * 0.8) * wobbleFactor;
                    } else {
                        this.mesh.rotation.x = 0;
                        this.mesh.rotation.z = 0;
                    }
                }
            }

            triggerAbility() {
                if (this.abilityCooldown <= 0) {
                    this.velocity.multiplyScalar(2.2);
                    this.abilityCooldown = 4.0;
                }
            }
        }

        class Marble {
            constructor(color, x, z, isPlayer) {
                this.isPlayer = isPlayer;
                this.position = new THREE.Vector3(x, 0.4, z);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.radius = 0.4;

                const geo = new THREE.SphereGeometry(this.radius, 32, 32);
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.1, metalness: 0.9, emissive: color, emissiveIntensity: 0.3 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(this.position);
                mesh.castShadow = true;
                scene.add(mesh);
                this.mesh = mesh;
            }

            update(dt) {
                this.velocity.multiplyScalar(0.995);
                this.position.addScaledVector(this.velocity, dt);

                // Wall bounds
                if (this.position.x < -4.5) { this.position.x = -4.5; this.velocity.x *= -0.5; }
                if (this.position.x > 4.5) { this.position.x = 4.5; this.velocity.x *= -0.5; }

                this.position.y = this.radius;

                if (this.mesh) {
                    this.mesh.position.copy(this.position);
                }
            }
        }

                const pg = new THREE.CylinderGeometry(0.8, 0.8, 1.2, 20);
                cfg.pillars.forEach(p => {
                    const m = new THREE.Mesh(pg, new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xb91c1c, emissiveIntensity: 0.6 }));

            rim.rotation.x = Math.PI / 2;

            if (type === 'VOLCANO') {
                const bumpPositions = [{ x: 6, z: 0 }, { x: -6, z: 0 }, { x: 0, z: 6 }, { x: 0, z: -6 }];

        for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {

                case 'h': if (MP.inMatch && playerTop && !playerTop.isEliminated && !window.__mpFrozen) { playerTop.stamina -= m.d; playerTop.velocity.x += m.kx; playerTop.velocity.z += m.kz; burst(playerTop.position.clone().setY(1.2), 0xff5555, 3.4, 0.3); shake = Math.max(shake, Math.min(0.4, m.d / 60)); } break;
                case 'out': {
                    if (!MP.inMatch) break; if (m.id === MP.id) { MP.place = m.place; break; }
                    const t = remote(m.id); if (t && !t.isEliminated) { t.eliminate(); toast(t.pname + ' IS OUT', ord(m.place) + ' place', '#f87171', 1800); }
                    break;
                }
                case 'end': endOfMatch(m); break;
            }
        }
        const remote = id => aiTops.find(t => t.remote && t.pid === id);

        // ---------------- match ----------------
        let sendTimer = 0, hudRaf = 0, cdTimers = [];
        function beginMatch(m) {
            closeScreen(); try { stopQuirk(); hideToast(); } catch (e) { }
            MP.inMatch = true; MP.out = false; MP.over = false; MP.place = 0; MP.names = {};
            clearScene(); battleVariant = 'MP'; gameMode = 'BATTLE';
            buildArenaFloor('RING');
            const n = m.players.length;
            window.__ringR = undefined; window.__auto = false; window.__B = null; window.__fall = false; window.__camX = 0; window.__camZ = 0; window.__damp = undefined;
            window.__mpFrozen = true; window.__spd = 1e-4; window.__drain = 0;
            m.players.forEach(p => {
                const ang = p.slot / n * Math.PI * 2 + 0.4, x = Math.cos(ang) * 7, z = Math.sin(ang) * 7, skin = SKINS_DATABASE[p.skin] || SKINS_DATABASE[0];
                MP.names[p.id] = p.name;
                if (p.id === MP.id) { playerTop = new RealTop(true, skin, x, z, 1); playerTop.team = 'M' + p.id; return; }
                const t = new RealTop(false, skin, x, z, 1);
                t.remote = true; t.pid = p.id; t.pname = p.name; t.team = 'M' + p.id; t.tx = x; t.tz = z; t.tvx = 0; t.tvz = 0; t.netStam = null; t.steer = null;
                t.update = function (dt) {
                    if (this.isEliminated) return;
                    this.tx += this.tvx * dt; this.tz += this.tvz * dt;                                   // keep gliding between packets
                    const k = Math.min(1, dt * 12); this.position.x += (this.tx - this.position.x) * k; this.position.z += (this.tz - this.position.z) * k;
                    this.velocity.set(this.tvx, 0, this.tvz); if (this.netStam != null) this.stamina = Math.max(0.01, this.netStam);
                    if (this.mesh) {
                        this.mesh.position.copy(this.position); const r = this.stamina / this.maxStamina; this.mesh.rotation.y += r * 1.6;
                        if (r < 0.4) { const f = (0.4 - r) * 0.9, w = performance.now() * 0.025; this.mesh.rotation.x = Math.sin(w) * f; this.mesh.rotation.z = Math.cos(w * 0.8) * f; } else { this.mesh.rotation.x = 0; this.mesh.rotation.z = 0; }
                    }
                };
                aiTops.push(t);
            });
            showScreen('ingame-hud'); $('hud-marble-container').classList.add('hidden'); $('hud-top-container').classList.remove('hidden');
            const jb = $('virtual-joystick-base'); if (jb) jb.style.visibility = 'visible';
            setBattleCam(); makeOverlay();
            let c = (m.countdown || 3); const big = $('mp-count'); big.style.display = 'block'; big.textContent = c;
            cdTimers.forEach(clearTimeout); cdTimers = [];
            for (let i = 1; i <= c; i++) cdTimers.push(setTimeout(() => { if (!MP.inMatch) return; big.textContent = (c - i) || 'FIGHT!'; if (i === c) { window.__mpFrozen = false; window.__spd = 1; window.__drain = undefined; cdTimers.push(setTimeout(() => { big.style.display = 'none'; }, 700)); } }, i * 1000));
            clearInterval(sendTimer); sendTimer = setInterval(sendState, 66);
            cancelAnimationFrame(hudRaf); hudRaf = requestAnimationFrame(overlayLoop);
        }
        function sendState() {
            if (!MP.inMatch || !playerTop || MP.out) return;
            if (playerTop.isEliminated) { onMeOut(); return; }
            wsSend({ t: 's', x: +playerTop.position.x.toFixed(3), z: +playerTop.position.z.toFixed(3), vx: +playerTop.velocity.x.toFixed(2), vz: +playerTop.velocity.z.toFixed(2), stam: +playerTop.stamina.toFixed(1), mx: +playerTop.maxStamina.toFixed(1) });
        }
        function onMeOut() { if (MP.out || !MP.inMatch) return; MP.out = true; wsSend({ t: 'out' }); }
        window.__mpHit = function (b, dmg, kv) { if (!MP.inMatch || MP.out || window.__mpFrozen) return; wsSend({ t: 'h', to: b.pid, d: Math.round(dmg * 10) / 10, kx: +kv.x.toFixed(2), kz: +kv.z.toFixed(2) }); };
        function endOfMatch(m) {
            if (!MP.inMatch || MP.over) return; MP.over = true; MP.inMatch = false; clearInterval(sendTimer); cancelAnimationFrame(hudRaf);
            const mine = (m.results || []).find(r => r.id === MP.id), place = mine ? mine.place : (MP.place || (m.results || []).length), n = (m.results || []).length, vodsGot = (m.reward && m.reward[MP.id]) || 20;
            const win = place === 1;
            endMatch(win, vodsGot);
            $('game-over-title').textContent = win ? 'VICTORY!' : ord(place) + ' PLACE';
            const sub = $('game-over-subtitle'); if (sub) sub.textContent = (m.results || []).map(r => ord(r.place) + ' ' + r.name).join('   ');
            removeOverlay(); pushSave(false); refreshStats();
        }
        async function refreshStats() { try { const j = await req('GET', '/api/me'); MP.stats = j.stats; } catch (e) { } }
        function disconnected() {
            MP.inMatch = false; clearInterval(sendTimer); cancelAnimationFrame(hudRaf); removeOverlay();
            if (gameMode === 'BATTLE') { endMatch(false, 0); $('game-over-title').textContent = 'DISCONNECTED'; const s = $('game-over-subtitle'); if (s) s.textContent = 'Lost the connection to the server.'; }
        }
        window.__mpCleanup = function () {
            const was = MP.inMatch || battleVariant === 'MP';
            if (MP.inMatch) { MP.inMatch = false; }
            clearInterval(sendTimer); cancelAnimationFrame(hudRaf); cdTimers.forEach(clearTimeout); cdTimers = []; removeOverlay(); closeScreen();
            if (MP.ws && MP.room) { wsSend({ t: 'leave' }); MP.room = null; }
            if (battleVariant === 'MP') { battleVariant = 'TEAM'; window.__mpFrozen = false; window.__spd = 1; window.__drain = undefined; }
            return was;
        };
        // hook the stock win / death logic
        const _cw = window.checkWin; window.checkWin = function () { if (isMP()) return; return _cw.apply(this, arguments); };
        const _po = window.playerOut; window.playerOut = function () { if (isMP()) { onMeOut(); return; } return _po.apply(this, arguments); };
        const _rm = returnToMenu; returnToMenu = function () { try { window.__mpCleanup(); } catch (e) { } _rm.apply(this, arguments); };

        // ---------------- in-match overlay: scoreboard, name tags, countdown, "you are out" banner ----------------
        let tagBox = null;
        function makeOverlay() {
            removeOverlay();
            const hud = document.createElement('div'); hud.id = 'mp-hud';
            hud.style.cssText = 'position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:70;pointer-events:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:78vw;font-family:Orbitron,sans-serif';
            const cnt = document.createElement('div'); cnt.id = 'mp-count'; cnt.style.cssText = 'position:fixed;left:0;right:0;top:34%;text-align:center;z-index:75;pointer-events:none;font-family:Orbitron,sans-serif;font-weight:900;font-size:min(22vw,120px);color:#fde047;text-shadow:0 0 24px #f59e0b,0 0 6px #000;display:none';
            const out = document.createElement('div'); out.id = 'mp-out'; out.style.cssText = 'position:fixed;left:0;right:0;bottom:max(90px,env(safe-area-inset-bottom));text-align:center;z-index:70;pointer-events:none;font-family:Orbitron,sans-serif;font-weight:800;font-size:14px;color:#fca5a5;text-shadow:0 0 8px #000;display:none';
            tagBox = document.createElement('div'); tagBox.id = 'mp-tags'; tagBox.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden';
            [hud, cnt, out, tagBox].forEach(e => document.body.appendChild(e));
        }
        function removeOverlay() { ['mp-hud', 'mp-count', 'mp-out', 'mp-tags'].forEach(id => { const e = $(id); if (e) e.remove(); }); tagBox = null; }
        let hudAt = 0;
        function overlayLoop(now) {
            if (!MP.inMatch) return; hudRaf = requestAnimationFrame(overlayLoop);
            if (tagBox) {
                const w = window.innerWidth, h = window.innerHeight;
                aiTops.forEach(t => {
                    if (!t.remote) return; let el = tagBox.querySelector('[data-p="' + t.pid + '"]');
                    if (!el) { el = document.createElement('div'); el.dataset.p = t.pid; el.style.cssText = 'position:absolute;transform:translate(-50%,-100%);font:700 11px Orbitron,sans-serif;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;white-space:nowrap'; el.textContent = t.pname; tagBox.appendChild(el); }
                    if (t.isEliminated) { el.style.display = 'none'; return; }
                    try { const v = t.position.clone(); v.y = 3.4; v.project(camera); if (v.z > 1) { el.style.display = 'none'; return; } el.style.display = 'block'; el.style.left = ((v.x * 0.5 + 0.5) * w) + 'px'; el.style.top = ((-v.y * 0.5 + 0.5) * h) + 'px'; } catch (e) { el.style.display = 'none'; }
                });
            }
            if (now - hudAt > 120) {
                hudAt = now; const hud = $('mp-hud'); if (!hud) return;
                const rows = [playerTop].concat(aiTops).filter(t => t).map(t => ({ n: t.remote ? t.pname : MP.name, r: t.isEliminated ? 0 : Math.max(0, Math.min(1, t.stamina / t.maxStamina)), out: !!t.isEliminated, me: !t.remote }));
                hud.innerHTML = rows.map(x => '<div style="min-width:74px;padding:3px 6px;border-radius:8px;background:rgba(15,23,42,.72);border:1px solid ' + (x.me ? '#22d3ee' : '#475569') + ';opacity:' + (x.out ? 0.45 : 1) + '"><div style="font-size:9px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;' + (x.out ? 'text-decoration:line-through' : '') + '">' + esc(x.n) + '</div><div style="height:5px;background:#1e293b;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + Math.round(x.r * 100) + '%;background:' + (x.r > 0.4 ? '#22c55e' : '#ef4444') + '"></div></div></div>').join('');
                const o = $('mp-out'); if (o) { if (MP.out) { o.style.display = 'block'; o.textContent = 'YOU ARE OUT' + (MP.place ? ' - ' + ord(MP.place) + ' PLACE' : '') + '  -  watching the rest'; } else o.style.display = 'none'; }
            }
        }
    })();

})();
</script>
